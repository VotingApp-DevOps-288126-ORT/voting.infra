controller:
  replicaCount: 1
  minAvailable: 1
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: false

  service:
    type: NodePort
    externalTrafficPolicy: Local
    targetPorts:
      http: http
      https: http

  ingressClassResource:
    name: nginx
    enabled: true
    default: true

  admissionWebhooks:
    enabled: false  

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
